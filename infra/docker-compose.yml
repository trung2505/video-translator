version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-video_translator}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../.env
    volumes:
      - ../backend:/app:delegated
      - ../media:/app/storage
      - hf_models:/models/huggingface
    environment:
      - HF_HOME=/models/huggingface
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    command: ["sh", "-c", "/app/scripts/init-db.sh && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../.env
    volumes:
      - ../backend:/app:delegated
      - ../media:/app/storage
      - hf_models:/models/huggingface
    environment:
      - HF_HOME=/models/huggingface
    depends_on:
      - redis
      - postgres
      - backend
    command: ["sh", "-c", "celery -A app.workers.celery_app.celery_app worker --loglevel=info"]

  frontend:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ../frontend:/app:delegated
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  hf_models:
